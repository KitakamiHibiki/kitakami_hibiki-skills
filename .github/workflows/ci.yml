name: CI

on:
  push:
    branches: [main, master]
    paths: ['bin/**']
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths: ['bin/**']

defaults:
  run:
    working-directory: bin

jobs:
  # ── CI check: runs on push/PR to main (non-tag) ──
  check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.23']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: bin/go.sum
      - run: go mod tidy
      - run: go vet ./...
      - name: Build all
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/skills-build
          for dir in */; do
            if [ -f "${dir}main.go" ]; then
              name="$(basename "$dir")"
              echo "Building $name..."
              go build -o /tmp/skills-build "./${name}"
            fi
          done

  # ── Release: runs only on tag push (v*) ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: bin/go.sum
      - run: go mod tidy
        working-directory: bin

      - name: Build all platforms
        working-directory: bin
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-X skills/bin/internal/version.Version=${VERSION} -X skills/bin/internal/version.Commit=${COMMIT} -X skills/bin/internal/version.Date=${DATE}"

          mkdir -p build/artifacts

          build() {
            local os="$1" arch="$2" ext="$3"
            local dir="build/artifacts/skills-${VERSION}-${os}-${arch}"
            mkdir -p "$dir"
            GOOS="$os" GOARCH="$arch" go build -ldflags "$LDFLAGS" -o "${dir}/pixiv${ext}" ./pixiv/
            GOOS="$os" GOARCH="$arch" go build -ldflags "$LDFLAGS" -o "${dir}/wechat${ext}" ./wechat/
          }

          build linux   amd64   ""
          build windows amd64   ".exe"
          build darwin  amd64   ""
          build darwin  arm64   ""

      - name: Package ZIPs
        working-directory: bin
        run: |
          cd build/artifacts
          for d in skills-*; do
            zip -j "${d}.zip" "$d"/*
          done

      - name: Stage install-skill.md
        run: cp skills/install/SKILL.md bin/build/artifacts/install-skill.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/build/artifacts/skills-*.zip
            bin/build/artifacts/install-skill.md
          overwrite_files: true
